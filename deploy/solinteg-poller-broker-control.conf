# Deployed Dell 2026-11-04 after stopping the direct poller and releasing TCP:502.
# Never start read-only and control broker services at the same time.
[Unit]
BindsTo=solinteg-broker-control.service
After=solinteg-broker-control.service

[Service]
# Preserve current poller fallback and decoding; broker owns the TCP session.
Environment=SOLINTEG_POLL_SOURCE=broker_legacy
Environment=SOLINTEG_BROKER_SOCKET=/run/solinteg-broker/broker.sock
# Prevent the migrated poller from creating a parallel TCP client.
RestrictAddressFamilies=AF_UNIX
