# Deployed Dell 2026-11-04. Original dispatch algorithm, watchdog and fallback intact.
# Without a live broker IPC route the dispatcher cannot issue control writes.
[Unit]
BindsTo=solinteg-broker-control.service
After=solinteg-broker-control.service

[Service]
Environment=SOLINTEG_MODBUS_SOURCE=broker
# Independent broker safety recovery is deliberately out of scope.
Environment=DISPATCH_BROKER_STALE_GUARD=0
