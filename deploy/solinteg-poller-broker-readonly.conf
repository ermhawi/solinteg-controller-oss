# Staged opt-in only. This is a TEMPLATE, not installed by the source checkout.
# Install as /etc/systemd/system/solinteg-poller.service.d/20-broker-readonly.conf
# ONLY after stopping the original direct poller and verifying TCP release.
# Remove this drop-in on rollback BEFORE restarting original poller.
[Unit]
Requires=solinteg-broker-readonly.service
After=solinteg-broker-readonly.service

[Service]
Environment=SOLINTEG_POLL_SOURCE=broker
Environment=SOLINTEG_BROKER_SOCKET=/run/solinteg-broker/broker.sock
# Defense-in-depth: the migrated poller cannot open its own TCP socket.
RestrictAddressFamilies=AF_UNIX
